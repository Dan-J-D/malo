# OAuth2-only Dovecot for Malo's tests: AUTHENTICATE XOAUTH2/OAUTHBEARER with tokens from the mock
# OAuth2 provider (validated by token introspection). Password login is not possible.
mail_home = /srv/mail/%Lu
mail_location = sdbox:~/Mail
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000
protocols = imap
listen = *
disable_plaintext_auth = yes
mail_max_userip_connections = 200

auth_mechanisms = xoauth2 oauthbearer
passdb {
  driver = oauth2
  mechanisms = xoauth2 oauthbearer
  args = /etc/dovecot/dovecot-oauth2.conf.ext
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%Lu
}

ssl = required
ssl_cert = </etc/dovecot/cert.pem
ssl_key = </etc/dovecot/key.pem

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

log_path = /dev/stdout
info_log_path = /dev/stdout
