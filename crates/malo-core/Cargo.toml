[package]
name = "malo-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
malo-api.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
rand.workspace = true
hex.workspace = true
base64.workspace = true
sha2.workspace = true
hmac.workspace = true
hkdf.workspace = true
aes-gcm.workspace = true
argon2.workspace = true
zeroize.workspace = true
secrecy.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
reqwest.workspace = true
oauth2.workspace = true
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
imap-proto = "0.16"
opendal = { version = "0.54", default-features = false, features = ["services-fs", "services-s3", "services-gcs", "services-azblob", "services-webdav", "services-b2"] }
url = "2"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl", "functions"] }
mail-parser = "0.11"
ammonia = "4"
infer = "0.19"
bytes = "1"
regex = "1"
once_cell = "1"
unicode-normalization = "0.1"

[features]
# Test builds only: seeded I/O fault injection for storage and local disk (see src/faults.rs).
fault-injection = []

[dev-dependencies]
tempfile = "3"
# The in-memory service backs unit tests only; destinations can never use it.
opendal = { version = "0.54", default-features = false, features = ["services-memory"] }
