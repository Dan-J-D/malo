[workspace]
resolver = "2"
exclude = ["fuzz"]
members = ["crates/malo-core", "crates/malo-api", "crates/malo-server", "src-tauri"]
default-members = ["crates/malo-core", "crates/malo-api", "crates/malo-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
malo-core = { path = "crates/malo-core" }
malo-api = { path = "crates/malo-api" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes-gcm = { version = "0.10", features = ["zeroize"] }
argon2 = { version = "0.5", features = ["zeroize"] }
zeroize = { version = "1", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"
rustls-pemfile = "2"
ts-rs = { version = "10", features = ["serde-compat", "chrono-impl", "uuid-impl", "serde-json-impl"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
