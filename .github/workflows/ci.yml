name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

# Actions are pinned by commit; jobs only read the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt · clippy · unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: System libraries (Tauri)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - name: Sidecar placeholder for tauri-build
        run: mkdir -p src-tauri/binaries && touch src-tauri/binaries/malo-server-x86_64-unknown-linux-gnu && mkdir -p dist
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: TypeScript bindings are up to date
        run: git diff --exit-code src/lib/api/types.ts

  audit:
    name: Dependency audit (cargo-deny · npm audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check advisories bans sources
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm audit --audit-level=high

  frontend:
    name: Svelte / Astro
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync && npx svelte-check --tsconfig ./tsconfig.json
      - run: npm run build

  integration:
    name: Server integration (Dovecot · mock OAuth · RustFS · fake-gcs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: docker compose --profile test up -d dovecot dovecot-nouidplus mockoauth dovecot-oauth rustfs gcs toxiproxy
      - run: docker compose --profile test up rustfs-init
      - run: MALO_IT=1 cargo test -p malo-server --test integration
      - name: Lifecycle fuzz regressions + a short random run
        run: |
          MALO_IT=1 cargo test -p malo-server --test fuzz_lifecycle fuzz_regressions
          MALO_IT=1 MALO_FUZZ_RUNS=5 MALO_FUZZ_STEPS=60 MALO_FUZZ_SEED=${{ github.run_number }} \
            cargo test -p malo-server --test fuzz_lifecycle fuzz_client -- --nocapture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-lifecycle-failures
          path: target/fuzz-lifecycle/
      - if: failure()
        run: docker compose --profile test logs --tail 200

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -f docker/Dockerfile -t malo-server:ci .
      - name: Boots and reports healthy
        run: |
          docker run -d --name malo -p 8443:8443 malo-server:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' malo)" = healthy ] && exit 0
            sleep 2
          done
          docker logs malo; exit 1

  desktop:
    name: Desktop bundles
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,appimage,rpm
          - os: macos-14
            bundles: app,dmg
          - os: windows-2022
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - run: node scripts/build-sidecar.mjs
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: malo-${{ matrix.os }}
          path: target/release/bundle/

  e2e:
    name: GUI end-to-end (tauri-driver)
    runs-on: ubuntu-24.04
    needs: [docker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - run: cargo install tauri-driver --version 2.1.0 --locked
      - run: node scripts/build-sidecar.mjs --debug && npx tauri build --debug --no-bundle
      - run: docker build -f docker/Dockerfile -t malo-server:latest .
      - run: docker compose --profile test up -d dovecot mockoauth dovecot-oauth
      - run: e2e/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/out/*.png

  fuzz-nightly:
    name: Nightly fuzzing (lifecycle + parsers)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: docker compose --profile test up -d dovecot dovecot-nouidplus mockoauth dovecot-oauth rustfs gcs toxiproxy
      - run: docker compose --profile test up rustfs-init
      - name: Long lifecycle fuzz
        run: |
          MALO_IT=1 MALO_FUZZ_RUNS=60 MALO_FUZZ_STEPS=120 MALO_FUZZ_SEED=$(date +%s) \
            cargo +stable test -p malo-server --test fuzz_lifecycle fuzz_client -- --nocapture
      - name: Parser fuzz targets (3 min each)
        working-directory: fuzz
        run: |
          for t in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$t" -- -max_total_time=180 -rss_limit_mb=4096
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-failures
          path: |
            target/fuzz-lifecycle/
            fuzz/artifacts/
